<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinosaur Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1>Dinosaur</h1>
      <p>Space / ↑ jump</p>
    </header>

    <div class="stage-wrap">
      <canvas id="game" width="900" height="280" aria-label="Dinosaur runner game"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h2 id="overlay-title">Ready</h2>
          <p id="overlay-msg">Press start or space</p>
          <button id="start-btn" type="button">Start</button>
        </div>
      </div>
    </div>

    <footer class="hud">
      <span>HI <strong id="best">0</strong></span>
      <span><strong id="score">0</strong></span>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
